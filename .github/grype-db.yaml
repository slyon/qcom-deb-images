#
# PROTOTYPE: grype-db configuration to build a Grype vulnerability database
# for our Debian images, from Anchore's data of the providers they need and
# our QLI advisories; see scripts/grype-db-qli-provider.py
#
# The SBOMs only have Debian packages (Syft's debian cataloger), so they only
# need the Debian provider's data, NVD's for the CVSS of the related
# vulnerabilities, EPSS and KEV for the risk scores, and EOL for the end of
# life of the releases. The provider data is restored into data/<provider>
# from Anchore's daily caches beforehand, so nothing is pulled here.
provider:
  root: data
  configs:
    - name: debian
    - name: nvd
    - name: epss
    - name: kev
    - name: eol
    # generated by scripts/grype-db-qli-provider.py beforehand
    - name: qli
      kind: external
      config:
        cmd: "true"
        state: qli/metadata.json

build:
  batch-size: 10000
